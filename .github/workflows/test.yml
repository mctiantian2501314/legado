name: Test Build

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/ISSUE_TEMPLATE/**'
      - '!**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_run:
    workflows: [Build Web]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') }} && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Luoyacheng')
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      commit_count: ${{ steps.set-ver.outputs.commit_count }}
      lanzou: ${{ steps.check.outputs.lanzou }}
      telegram: ${{ steps.check.outputs.telegram }}
      gitee: ${{ steps.check.outputs.gitee }}
      sgithub: ${{ steps.check.outputs.sgithub }}
      updateLog_updated: ${{ steps.updateLog.outputs.updated }}
      updateLog_content: ${{ steps.updateLog.outputs.body }}
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      # 修复：更精确的版本号计算
      - id: set-ver
        run: |
          export TZ='Asia/Shanghai'
          
          # 获取当前时间
          current_date=$(date +%Y-%m-%d)
          current_year=$(date +%y)
          current_month=$(date +%-m)
          current_day=$(date +%-d)
          
          echo "当前日期: $current_date"
          echo "当前年份: $current_year"
          echo "当前月份: $current_month"
          echo "当前日期: $current_day"
          
          # 计算当天的提交次数（从00:00到当前时间）
          # 使用git rev-list更准确
          commit_count=$(git rev-list --count HEAD --since="$(date +%Y-%m-%d) 00:00:00" 2>/dev/null || echo "0")
          
          # 如果没有找到当天的提交，可能是第一次提交
          if [ "$commit_count" -eq "0" ] || [ -z "$commit_count" ]; then
            commit_count=1
          else
            # 确保至少为1
            commit_count=$((commit_count))
          fi
          
          echo "当日提交数量: $commit_count"
          
          # 生成版本号
          version_base="$current_year.$current_month.$current_day"
          
          if [ "$commit_count" -gt "1" ]; then
            version="$version_base.$commit_count"
          else
            version="$version_base"
          fi
          
          echo "生成版本号: $version"
          
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
      
      - id: check
        run: |
          if [ -n "${{ secrets.LANZOU_ID }}" ]; then
            echo "lanzou=yes" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.BOT_TOKEN }}" ]; then
            echo "telegram=yes" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.GITEE_TOKEN }}" ]; then
            echo "gitee=yes" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.S_GITHUB_TOKEN }}" ]; then
            echo "sgithub=yes" >> $GITHUB_OUTPUT
          fi
      
      - id: updateLog
        run: |
          git fetch --unshallow --depth=20 origin main 2>/dev/null || git fetch --depth=20 origin main 2>/dev/null || true
          UPDATED_CONTENT=""
          IS_MERGE_PR=false
          COMMIT_MSG="${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}"
          
          if [[ -n "$COMMIT_MSG" ]]; then
            if [[ "$COMMIT_MSG" =~ ^"Merge pull request" ]] || 
              [[ "$COMMIT_MSG" =~ ^"Merge branch" ]] || 
              [[ "$COMMIT_MSG" =~ ^"Sync upstream" ]]; then
              IS_MERGE_PR=true
            fi
          fi
          
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null)
          UPDATE_LOG_CHANGED=$(echo "$CHANGED_FILES" | grep -q "app/src/main/assets/updateLog.md" && echo "yes" || echo "no")
          CRONET_JSON_CHANGED=$(echo "$CHANGED_FILES" | grep -q "app/src/main/assets/cronet.json" && echo "yes" || echo "no")
          
          if [ "$UPDATE_LOG_CHANGED" = "yes" ] && [ "$CRONET_JSON_CHANGED" = "no" ]; then
            echo "updated=yes" >> $GITHUB_OUTPUT
            if [ -f "app/src/main/assets/updateLog.md" ]; then
              UPDATED_CONTENT=$(awk '
              /^\*\*20/ && !found {
                found=1
                print
                next
              }
              found && NF == 0 { exit }
              found { print }
              END {
                if (!found) {
                  system("head -n 10 app/src/main/assets/updateLog.md")
                }
              }
              ' app/src/main/assets/updateLog.md)
            fi
          elif [ "$IS_MERGE_PR" = true ]; then
            UPDATED_CONTENT="$COMMIT_MSG"
          else
            if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              COMMIT_RANGE="${{ github.event.before }}..${{ github.event.after }}"
              if git rev-parse "$COMMIT_RANGE" >/dev/null 2>&1; then
                UPDATED_CONTENT=$(git log $COMMIT_RANGE --pretty=format:"• %s" --reverse 2>/dev/null | grep -v "^• Merge" || echo "• $COMMIT_MSG")
              else
                UPDATED_CONTENT=$(git log -10 --pretty=format:"• %s (%h)" --reverse 2>/dev/null | grep -v "^• Merge")
              fi
            fi
          fi
          
          if [ -z "$UPDATED_CONTENT" ]; then
            UPDATED_CONTENT=$(git log -1 --pretty=%B)
          fi
          
          CONTENT_JSON=$(echo "$UPDATED_CONTENT" | jq -Rs . 2>/dev/null || echo "\"Error generating update content\"")
          echo "body=$CONTENT_JSON" >> $GITHUB_OUTPUT
      
      - id: set-matrix
        run: |
          if [ "${{ steps.updateLog.outputs.updated }}" == "yes" ]; then
            echo 'build_matrix={"product":["app"],"type":["release","releaseS"]}' >> $GITHUB_OUTPUT
          else
            echo 'build_matrix={"product":["app"],"type":["release"]}' >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT_COUNT: ${{ needs.prepare.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      
      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "">$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt
      
      - name: Release Apk Sign
        run: |
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          cat >> $GITHUB_WORKSPACE/gradle.properties << EOF
          RELEASE_STORE_FILE=./legado.jks
          RELEASE_KEY_ALIAS=legado
          RELEASE_STORE_PASSWORD=gedoor_legado
          RELEASE_KEY_PASSWORD=gedoor_legado
          EOF
      
      - name: Add Cronet ProGuard Rules
        run: |
          echo "添加Cronet ProGuard规则以解决R8编译错误"
          cat >> $GITHUB_WORKSPACE/app/proguard-rules.pro << 'EOF'
          
          # ===================================================
          # Cronet网络库规则 - 解决R8缺失类错误
          # ===================================================
          
          -keep class org.chromium.net.** { *; }
          -keep class com.google.android.gms.org.conscrypt.** { *; }
          -keep class com.google.net.** { *; }
          
          -keep class * extends org.chromium.net.CronetProvider {
            public <methods>;
            protected <methods>;
          }
          
          -keep class org.chromium.net.CronetEngine$Builder {
            public <methods>;
            protected <methods>;
          }
          
          -keep class org.chromium.net.impl.HttpEngineNativeProvider { *; }
          -keep class org.chromium.net.impl.NativeCronetProvider { *; }
          -keep class org.chromium.net.impl.JavaCronetProvider { *; }
          
          -keep interface org.chromium.net.** { *; }
          
          -dontwarn org.chromium.net.**
          -dontwarn com.google.android.gms.org.conscrypt.**
          -dontwarn com.google.net.**
          
          -keepclasseswithmembers class org.chromium.net.** {
            *;
          }
          
          -keepclassmembers class org.chromium.net.CronetEngine {
            public *;
            protected *;
          }
          
          -keepclassmembers class * implements org.chromium.net.UrlRequest$Callback {
            public *;
            protected *;
          }
          
          -keepclassmembers class * implements org.chromium.net.UploadDataProvider {
            public *;
            protected *;
          }
          
          EOF
          echo "Cronet ProGuard规则添加完成"
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      
      - name: Build With Gradle
        continue-on-error: true
        run: |
          if [ "${{ env.type }}" == 'release' ]; then
            typeName="原包名"
          else
            typeName="共存"
            sed "s/'.release'/'.releaseS'/" $GITHUB_WORKSPACE/app/build.gradle  -i
          fi
          
          echo "统一版本号为: ${{ env.VERSION }}"
          sed "/def version/c def version = \"${{ env.VERSION }}\"" $GITHUB_WORKSPACE/app/build.gradle  -i
          
          echo "开始${{ env.product }}$typeName构建"
          chmod +x gradlew
          
          echo "构建命令: ./gradlew assemble${{ env.product }}release"
          if ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all; then
            echo "构建成功"
            build_success=true
          else
            echo "构建失败"
            build_success=false
            
            if [ -f "$GITHUB_WORKSPACE/app/build/outputs/mapping/*/missing_rules.txt" ]; then
              echo "找到missing_rules.txt，应用缺失规则..."
              cat $GITHUB_WORKSPACE/app/build/outputs/mapping/*/missing_rules.txt >> $GITHUB_WORKSPACE/app/proguard-rules.pro
              
              echo "清理并重新尝试构建..."
              ./gradlew clean
              
              if ./gradlew assemble${{ env.product }}release --build-cache --parallel --daemon --warning-mode all; then
                echo "重新构建成功"
                build_success=true
              else
                echo "重新构建失败"
                build_success=false
              fi
            fi
          fi
          
          if [ "$build_success" = true ]; then
            echo "修改APK文件名，使用新版本号格式"
            mkdir -p ${{ github.workspace }}/apk/
            
            for file in `ls ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk 2>/dev/null || true`; do
              if [ "${{ env.type }}" == 'release' ]; then
                mv "$file" ${{ github.workspace }}/apk/legado_${{ env.VERSION }}_$typeName.apk
              else
                mv "$file" ${{ github.workspace }}/apk/legado_${{ env.VERSION }}_$typeName.apk
              fi
            done
            
            echo "移动mapping文件"
            mkdir -p ${{ github.workspace }}/mapping/
            for file in `ls ${{ github.workspace }}/app/build/outputs/mapping/*/mapping.txt 2>/dev/null || true`; do
              mv "$file" ${{ github.workspace }}/mapping/mapping.txt
            done
          else
            echo "构建失败，跳过文件移动"
          fi
      
      - name: Move Missing Rules Files
        run: |
          echo "移动missing_rules.txt文件"
          mkdir -p ${{ github.workspace }}/mapping/
          for file in `ls ${{ github.workspace }}/app/build/outputs/mapping/*/missing_rules.txt 2>/dev/null || true`; do
            mv "$file" ${{ github.workspace }}/mapping/missing_rules.txt
          done
      
      - name: Upload Missing Rules File To Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping.missing_rules
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/missing_rules.txt
      
      - name: Check Build production
        run: |
          if [ ! -d ${{ github.workspace }}/apk ]; then
            echo "构建产物目录不存在! 检查gradle日志。"
            exit 1
          fi
          cd ${{ github.workspace }}/apk/
          if [ ! -e legado_*.apk ]; then
            echo "未找到构建产物APK文件! 检查gradle日志。"
            exit 1
          fi
          echo "找到构建产物:"
          ls -la *.apk
          echo "版本号: ${{ env.VERSION }}"
          echo "当日提交次数: ${{ env.COMMIT_COUNT }}"
      
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado.${{ env.product }}.${{ env.type }}
          if-no-files-found: ignore
          path: ${{ github.workspace }}/apk/*.apk
      
      - name: Upload Mapping File To Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/mapping.txt

  prerelease:
    needs: [ prepare, build ]
    if: github.event_name != 'pull_request' && github.repository == 'mctiantian2501314/legado'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      
      - uses: actions/download-artifact@v7
        with:
          path: apk/
      
      - working-directory: apk/
        run: |
          # 移动所有APK文件到当前目录
          find . -name "*.apk" -type f -exec mv {} . \; 2>/dev/null || true
          # 删除空目录
          find . -type d -empty -delete 2>/dev/null || true
          
          echo "整理APK文件，当前目录:"
          ls -la
          
          # 重命名APK文件
          for file in *.apk; do
            if [ -f "$file" ]; then
              if [[ "$file" == *原包名* ]]; then
                new_name="${file//原包名/release}"
                mv "$file" "$new_name"
                echo "重命名: $file -> $new_name"
              elif [[ "$file" == *共存* ]]; then
                new_name="${file//共存/releaseS}"
                mv "$file" "$new_name"
                echo "重命名: $file -> $new_name"
              fi
            fi
          done
          
          echo "整理后的APK文件:"
          ls -la *.apk 2>/dev/null || echo "没有找到APK文件"
      
      # 发布正式版本（如果有更新日志变化）
      - name: Publish Official Release
        if: needs.prepare.outputs.updateLog_updated == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          name: legado_app_${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body: |
            ### 更新内容
            ${{ fromJSON(needs.prepare.outputs.updateLog_content) }}
            
            ### 版本信息
            - 版本号: ${{ env.VERSION }}
            - 构建时间: $(date -d "8 hour" -u +"%Y-%m-%d %H:%M:%S") UTC+8
            - 当日提交序号: ${{ needs.prepare.outputs.commit_count }}
          prerelease: false
          files: ${{ github.workspace }}/apk/*.apk
          fail_on_unmatched_files: false
      
      # 发布测试版（如果没有更新日志变化）
      - name: Publish Beta Release
        if: needs.prepare.outputs.updateLog_updated != 'yes'
        uses: softprops/action-gh-release@v2
        with:
          name: legado_app_${{ env.VERSION }}
          tag_name: beta
          body: |
            ### 更新内容
            ${{ fromJSON(needs.prepare.outputs.updateLog_content) }}
            
            ### 版本信息
            - 版本号: ${{ env.VERSION }}
            - 构建时间: $(date -d "8 hour" -u +"%Y-%m-%d %H:%M:%S") UTC+8
            - 当日提交序号: ${{ needs.prepare.outputs.commit_count }}
            - 注: 此为测试版
          prerelease: true
          files: ${{ github.workspace }}/apk/*.apk
          fail_on_unmatched_files: false
          overwrite: true

  lanzou:
    needs: [ prepare, build ]
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.lanzou == 'yes' }}
    runs-on: ubuntu-latest
    env:
      ylogin: ${{ secrets.LANZOU_ID }}
      phpdisk_info: ${{ secrets.LANZOU_PSD }}
      LANZOU_FOLDER_ID: ${{ secrets.LANZOU_FOLDER_ID }}
      LANZOU_URL: ${{ secrets.LANZOU_URL }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: apk/
      
      - working-directory: apk/
        run: |
          # 移动所有APK文件到当前目录
          find . -name "*.apk" -type f -exec mv {} . \; 2>/dev/null || true
          # 删除空目录
          find . -type d -empty -delete 2>/dev/null || true
          
          echo "蓝奏云上传文件列表:"
          ls -la *.apk 2>/dev/null || echo "没有找到APK文件"
      
      - name: Upload To Lanzou
        continue-on-error: true
        timeout-minutes: 10
        run: |
          path="$GITHUB_WORKSPACE/apk/"
          if [ -n "$(ls -A $path/*.apk 2>/dev/null || true)" ]; then
            python3 $GITHUB_WORKSPACE/.github/scripts/lzy_web.py "$path" "$LANZOU_FOLDER_ID"
            echo "[$(date -u -d '+8 hour' '+%Y.%m.%d %H:%M:%S')] 分享链接: $LANZOU_URL"
          else
            echo "没有找到APK文件，跳过蓝奏云上传"
          fi

  telegram:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.telegram == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: apk/
      
      - id: set-tags
        working-directory: apk/
        run: |
          # 移动所有APK文件到当前目录
          find . -name "*.apk" -type f -exec mv {} . \; 2>/dev/null || true
          # 删除空目录
          find . -type d -empty -delete 2>/dev/null || true
          
          has_plus=false
          for file in *.apk; do
            if [ -f "$file" ]; then
              if [[ "$file" == *原包名* ]]; then
                mv "$file" "${file//原包名/release}"
              else
                mv "$file" "${file//共存/releaseS}"
                has_plus=true
              fi
            fi
          done
          
          tags=""
          if [ "$has_plus" = true ]; then
            tags="#beta #plus"
          else
            tags="#beta"
          fi
          
          echo "TAGS=$tags" >> $GITHUB_OUTPUT
          echo "Telegram发送文件列表:"
          ls -la *.apk 2>/dev/null || echo "没有找到APK文件"
      
      - name: Post to channel
        continue-on-error: true
        timeout-minutes: 5
        uses: xireiki/channel-post@v1
        with:
          chat_id: ${{ secrets.CHANNEL_ID }}
          bot_token: ${{ secrets.BOT_TOKEN }}
          context: |
            版本号：${{ needs.prepare.outputs.version }}
            当日提交序号：${{ needs.prepare.outputs.commit_count }}
            更新内容：
            ${{ fromJSON(needs.prepare.outputs.updateLog_content) }}
            #阅读 #Legado #阅读Sigma ${{ steps.set-tags.outputs.TAGS }}
          path: apk/*
          method: sendFile

  gitee:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.gitee == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: apk/
      
      - working-directory: apk/
        run: |
          # 移动所有APK文件到当前目录
          find . -name "*.apk" -type f -exec mv {} . \; 2>/dev/null || true
          # 删除空目录
          find . -type d -empty -delete 2>/dev/null || true
          
          # 重命名APK文件
          for file in *.apk; do
            if [ -f "$file" ]; then
              if [[ "$file" == *原包名* ]]; then
                mv "$file" "${file//原包名/release}"
              else
                mv "$file" "${file//共存/releaseS}"
              fi
            fi
          done
          
          echo "Gitee上传文件列表:"
          ls -la *.apk 2>/dev/null || echo "没有找到APK文件"
      
      # 修复：改进Gitee上传，添加超时和重试机制
      - name: Upload to Gitee Release
        continue-on-error: true
        timeout-minutes: 15  # 设置超时时间
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: "mctiantian2501314"
          GITEE_REPO: "legado"
          VERSION: ${{ needs.prepare.outputs.version }}
          UPDATE_CONTENT: ${{ fromJSON(needs.prepare.outputs.updateLog_content) }}
          UPDATE_UPDATED: ${{ needs.prepare.outputs.updateLog_updated }}
        run: |
          # 安装必要工具
          sudo apt-get update && sudo apt-get install -y jq curl coreutils
          
          # 如果没有APK文件，直接退出
          if [ ! -d apk ] || [ -z "$(ls -A apk/*.apk 2>/dev/null || true)" ]; then
            echo "没有找到APK文件，跳过Gitee发布"
            exit 0
          fi
          
          API_BASE="https://gitee.com/api/v5/repos/$GITEE_USER/$GITEE_REPO"
          AUTH_HEADER="Authorization: token $GITEE_TOKEN"
          
          # 根据条件设置标签和发布类型
          if [ "$UPDATE_UPDATED" = "yes" ]; then
            TAG_NAME="$VERSION"
            PRERELEASE="false"
            RELEASE_NAME="legado_app_$VERSION"
            echo "🚀 发布正式版: $TAG_NAME"
          else
            TAG_NAME="beta"
            PRERELEASE="true"
            RELEASE_NAME="legado_app_$VERSION"
            echo "🧪 发布预发布版: $TAG_NAME"
          fi
          
          # 删除旧Release（如果有）
          echo "检查并删除旧版本..."
          if release_data=$(curl -s --max-time 30 -H "$AUTH_HEADER" "$API_BASE/releases/tags/$TAG_NAME"); then
            release_id=$(echo "$release_data" | jq -r '.id // empty' 2>/dev/null || echo "")
            if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
              echo "删除旧版本: $release_id"
              curl -s --max-time 30 -X DELETE -H "$AUTH_HEADER" "$API_BASE/releases/$release_id" || true
            fi
          fi
          
          # 准备更新内容（更安全的JSON处理）
          UPDATE_TEXT=$(echo "$UPDATE_CONTENT" | tr -d '\r' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          BODY_CONTENT="版本号: $VERSION\\n当日提交序号: ${{ needs.prepare.outputs.commit_count }}\\n\\n更新内容:\\n$UPDATE_TEXT"
          
          # 创建新Release，带重试机制
          MAX_RETRIES=3
          RETRY_COUNT=0
          RELEASE_CREATED=false
          RELEASE_ID=""
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ -z "$RELEASE_ID" ]; do
            echo "第 $((RETRY_COUNT+1)) 次尝试创建Release..."
            
            RELEASE_JSON=$(curl -s --max-time 60 -X POST \
              -H "Content-Type: application/json" \
              -H "$AUTH_HEADER" \
              -d '{
                "tag_name": "'"$TAG_NAME"'",
                "name": "'"$RELEASE_NAME"'",
                "body": "'"$BODY_CONTENT"'",
                "target_commitish": "main",
                "prerelease": '"$PRERELEASE"'
              }' \
              "$API_BASE/releases")
            
            if [ $? -eq 0 ] && [ -n "$RELEASE_JSON" ]; then
              RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty' 2>/dev/null || echo "")
              if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
                RELEASE_CREATED=true
                echo "✅ Release创建成功，ID: $RELEASE_ID"
                break
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "⚠️ 创建Release失败，等待5秒后重试..."
            sleep 5
          done
          
          # 检查是否成功创建Release
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ 创建Release失败，跳过文件上传"
            echo "响应: $RELEASE_JSON"
            exit 0  # 改为exit 0，不中断工作流
          fi
          
          # 上传所有APK文件，带重试机制
          for APK_FILE in apk/*.apk; do
            if [ -f "$APK_FILE" ]; then
              echo "上传: $APK_FILE"
              
              UPLOAD_RETRY=0
              UPLOAD_MAX_RETRIES=3
              UPLOAD_SUCCESS=false
              
              while [ $UPLOAD_RETRY -lt $UPLOAD_MAX_RETRIES ] && [ "$UPLOAD_SUCCESS" = false ]; do
                echo "第 $((UPLOAD_RETRY+1)) 次尝试上传..."
                
                UPLOAD_RESULT=$(curl -s --max-time 300 -X POST \
                  -H "$AUTH_HEADER" \
                  -F "file=@$APK_FILE" \
                  "$API_BASE/releases/$RELEASE_ID/attach_files")
                
                if [ $? -eq 0 ]; then
                  echo "✅ 已上传 $APK_FILE"
                  UPLOAD_SUCCESS=true
                else
                  UPLOAD_RETRY=$((UPLOAD_RETRY+1))
                  echo "⚠️ 上传失败，等待3秒后重试..."
                  sleep 3
                fi
              done
              
              if [ "$UPLOAD_SUCCESS" = false ]; then
                echo "❌ 上传 $APK_FILE 失败，已达到最大重试次数"
              fi
            fi
          done
          
          echo "✅ Gitee发布完成"

  update-storage:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'&& needs.prepare.outputs.sgithub == 'yes' && needs.prepare.outputs.updateLog_updated == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: legado.app.releaseS
          path: ./apk-releaseS
      
      - name: Check releaseS APK exists
        id: check-apk
        run: |
          if ls ./apk-releaseS/*.apk 1> /dev/null 2>&1; then
            echo "releaseS APK found"
            echo "apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "releaseS APK not found"
            echo "apk_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload to yuedu repository
        continue-on-error: true
        if: steps.check-apk.outputs.apk_exists == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # 克隆目标仓库
          git clone https://${{ secrets.S_GITHUB_TOKEN }}@github.com/mctiantian2501314/yuedu.git yuedu-repo || {
            echo "克隆仓库失败"
            exit 0
          }
          
          # 创建目录
          mkdir -p yuedu-repo/sigma
          
          # 复制releaseS APK文件并重命名
          for apk_file in ./apk-releaseS/*.apk; do
            if [ -f "$apk_file" ]; then
              cp "$apk_file" yuedu-repo/sigma/legado_Sigma_${{ needs.prepare.outputs.version }}.apk
              echo "复制文件: $apk_file"
            fi
          done
          
          # 检查是否有文件被复制
          if [ -f "yuedu-repo/sigma/legado_Sigma_${{ needs.prepare.outputs.version }}.apk" ]; then
            cd yuedu-repo
            git add sigma/legado_Sigma_${{ needs.prepare.outputs.version }}.apk
            
            # 检查是否有变化
            if git diff --cached --quiet; then
              echo "没有变化需要提交"
            else
              git commit -m "Update legado Sigma to version ${{ needs.prepare.outputs.version }} (当日第${{ needs.prepare.outputs.commit_count }}个提交)"
              git push || {
                echo "推送失败"
                exit 0
              }
              echo "✅ 更新完成"
            fi
          else
            echo "没有找到APK文件"
          fi

  # 新增：发布到GitHub Packages（如果需要）
  publish-packages:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && github.repository == 'mctiantian2501314/legado'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/download-artifact@v7
        with:
          path: apk-packages/
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Publish APK to GitHub Packages
        continue-on-error: true
        run: |
          # 创建package.json用于发布
          cat > package.json << EOF
          {
            "name": "@mctiantian2501314/legado",
            "version": "${{ env.VERSION }}",
            "description": "Legado阅读器APK文件",
            "main": "index.js",
            "scripts": {
              "test": "echo \"Error: no test specified\" && exit 1"
            },
            "repository": {
              "type": "git",
              "url": "git+https://github.com/mctiantian2501314/legado.git"
            },
            "author": "mctiantian2501314",
            "license": "MIT",
            "bugs": {
              "url": "https://github.com/mctiantian2501314/legado/issues"
            },
            "homepage": "https://github.com/mctiantian2501314/legado#readme",
            "publishConfig": {
              "registry": "https://npm.pkg.github.com/"
            }
          }
          EOF
          
          # 创建发布脚本
          cat > index.js << EOF
          console.log('Legado阅读器版本: ${{ env.VERSION }}');
          console.log('APK文件已发布到GitHub Packages');
          EOF
          
          # 发布到GitHub Packages
          echo "准备发布到GitHub Packages..."
          
          # 检查是否有APK文件
          if [ -d "apk-packages" ] && [ -n "$(ls -A apk-packages/*.apk 2>/dev/null || true)" ]; then
            echo "找到APK文件，开始发布..."
            
            # 创建dist目录并复制APK文件
            mkdir -p dist
            cp apk-packages/*.apk dist/ || true
            
            # 发布
            npm publish || echo "发布失败或已存在相同版本"
          else
            echo "没有找到APK文件，跳过发布"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
